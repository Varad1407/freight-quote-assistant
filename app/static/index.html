<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Freight Quote Assistant</title>
<style>
  :root { --ink:#1b1f24; --muted:#5b6570; --line:#dde2e7; --bg:#f6f7f9; --accent:#0b5cad; --ok:#1f7a3f; --warn:#a15c00; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color:var(--ink); background:var(--bg); }
  header { padding:20px 28px; background:#fff; border-bottom:1px solid var(--line); }
  header h1 { margin:0; font-size:20px; }
  header p { margin:4px 0 0; color:var(--muted); }
  main { display:grid; grid-template-columns:1fr 1fr; gap:20px; padding:20px 28px; max-width:1300px; margin:0 auto; }
  @media (max-width: 900px) { main { grid-template-columns:1fr; } }
  section { background:#fff; border:1px solid var(--line); border-radius:8px; padding:18px; }
  h2 { font-size:15px; margin:0 0 12px; }
  textarea { width:100%; min-height:340px; padding:12px; border:1px solid var(--line); border-radius:6px; font:14px/1.45 ui-monospace, Menlo, monospace; resize:vertical; }
  .row { display:flex; gap:10px; margin-top:12px; align-items:center; flex-wrap:wrap; }
  select, button { font:inherit; padding:8px 12px; border-radius:6px; border:1px solid var(--line); background:#fff; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); cursor:pointer; }
  button:disabled { opacity:.6; cursor:wait; }
  .badge { display:inline-block; padding:3px 10px; border-radius:999px; font-size:13px; font-weight:600; }
  .badge.ready_to_quote { background:#e3f4e8; color:var(--ok); }
  .badge.needs_info { background:#fff1dc; color:var(--warn); }
  .badge.needs_review { background:#fde8e8; color:#b42318; }
  table { width:100%; border-collapse:collapse; margin:12px 0; }
  td { padding:6px 4px; border-bottom:1px solid var(--line); vertical-align:top; }
  td:first-child { color:var(--muted); width:38%; }
  pre { white-space:pre-wrap; background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:12px; font:14px/1.5 inherit; }
  ul.warn { padding-left:18px; color:var(--warn); }
  .muted { color:var(--muted); }
  .error { color:#b42318; }
</style>
</head>
<body>
<header>
  <h1>Freight Quote Assistant</h1>
  <p>Paste a customer's quote request. Get structured shipment data, missing-info checks and a draft reply.</p>
</header>
<main>
  <section>
    <h2>Incoming email</h2>
    <textarea id="email" placeholder="Paste a quote-request email here…"></textarea>
    <div class="row">
      <select id="samples"><option value="">Load a sample email…</option></select>
      <button class="primary" id="run">Process email</button>
      <span id="status" class="muted"></span>
    </div>
  </section>
  <section id="result">
    <h2>Result</h2>
    <p class="muted">Results appear here.</p>
  </section>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  let samples = [];

  // Build DOM with textContent only, so email content can never inject HTML.
  function el(tag, text, cls) {
    const node = document.createElement(tag);
    if (text !== undefined) node.textContent = text;
    if (cls) node.className = cls;
    return node;
  }

  async function loadSamples() {
    try {
      samples = await (await fetch("/api/samples")).json();
      samples.forEach((s, i) => $("samples").appendChild(Object.assign(el("option", s.name.replaceAll("_", " ")), { value: i })));
    } catch { /* demo still works without samples */ }
  }

  $("samples").addEventListener("change", (e) => {
    if (e.target.value !== "") $("email").value = samples[e.target.value].email_text;
  });

  function render(data) {
    const box = $("result");
    box.replaceChildren(el("h2", "Result"));
    const labels = { ready_to_quote: "Ready to quote", needs_info: "Needs more info", needs_review: "Needs human review" };
    const label = labels[data.status] || data.status;
    box.appendChild(el("span", label, "badge " + data.status));
    box.appendChild(el("span", `  extracted in ${data.attempts} attempt${data.attempts > 1 ? "s" : ""}`, "muted"));

    const s = data.shipment;
    const loc = (l) => [l.city, l.country].filter(Boolean).join(", ") || "—";
    const rows = [
      ["Customer", [s.customer_name, s.company].filter(Boolean).join(" · ") || "—"],
      ["Origin", loc(s.origin)], ["Destination", loc(s.destination)],
      ["Mode", s.mode], ["Cargo", s.cargo_description || "—"], ["Cargo type", s.cargo_type],
      ["Pieces", s.pieces ?? "—"], ["Weight", s.weight_kg ? `${s.weight_kg.toLocaleString()} kg` : "—"],
      ["Volume", s.volume_cbm ? `${s.volume_cbm} cbm` : "—"], ["Dimensions", s.dimensions || "—"],
      ["Ready date", s.ready_date || "—"], ["Incoterm", s.incoterm || "—"], ["Notes", s.notes || "—"],
    ];
    const table = el("table");
    rows.forEach(([k, v]) => { const tr = el("tr"); tr.append(el("td", k), el("td", String(v))); table.appendChild(tr); });
    box.appendChild(table);

    if (data.warnings.length) {
      box.appendChild(el("h2", "Internal flags"));
      const ul = el("ul", undefined, "warn");
      data.warnings.forEach((w) => ul.appendChild(el("li", w)));
      box.appendChild(ul);
    }
    box.appendChild(el("h2", "Draft reply"));
    box.appendChild(el("pre", `Subject: ${data.reply_subject}\n\n${data.reply_body}`));
  }

  $("run").addEventListener("click", async () => {
    const text = $("email").value.trim();
    if (text.length < 20) { $("status").textContent = "Paste an email first (min 20 characters)."; return; }
    $("run").disabled = true; $("status").textContent = "Processing…";
    try {
      const res = await fetch("/api/quote-requests", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email_text: text }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(typeof data.detail === "string" ? data.detail : "Request failed");
      render(data); $("status").textContent = "";
    } catch (err) {
      $("result").replaceChildren(el("h2", "Result"), el("p", err.message, "error"));
      $("status").textContent = "";
    } finally { $("run").disabled = false; }
  });

  loadSamples();
</script>
</body>
</html>
